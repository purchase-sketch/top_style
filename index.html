<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Top Style Pivot Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <style>
        :root { --p: #4f46e5; --bg: #f3f4f6; --tx: #1f2937; --bd: #d1d5db; --blue-light: #eef2ff; --blue-dark: #3730a3; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--tx); padding: 15px; font-size: 13px; }
        
        .card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bd); padding-bottom: 10px; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .header-top h1 { font-size: 1.2rem; margin: 0; }
        
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .action-btn { color: #fff; text-decoration: none; padding: 7px 14px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; border: none; cursor: pointer; }
        .btn-upload { background: var(--p); }
        .btn-excel { background: #10b981; }
        .btn-pdf { background: #ef4444; }
        .action-btn:hover { opacity: 0.9; }
        
        .filter-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-bar input { padding: 8px 12px; border: 1px solid var(--bd); border-radius: 6px; font-size: 0.9rem; min-width: 220px; }
        .btn-filter-toggle { background: #fff; color: var(--tx); border: 1px solid var(--bd); padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-apply-filters { background: var(--p); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-reset { background: #f43f5e; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        
        .filter-panel { display: none; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 15px; background: #f8fafc; border: 1px solid var(--bd); border-radius: 6px; margin-bottom: 15px; }
        .filter-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: #4b5563; }
        .filter-group select { width: 100%; padding: 6px; border: 1px solid var(--bd); border-radius: 4px; background: #fff; height: 90px; }

        .pivot-title { font-weight: 700; margin-bottom: 8px; color: var(--blue-dark); font-size: 0.95rem; }
        .pivot-options { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: #fff; border: 1px solid var(--bd); border-radius: 6px; }
        .pivot-options label { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 4px 8px; border: 1px solid #e5e7eb; border-radius: 4px; background: #f9fafb; }
        .pivot-options label:hover { background: var(--blue-light); }
        
        .table-wrap { overflow-x: auto; border: 1px solid var(--bd); border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th { background: var(--blue-light); color: var(--blue-dark); font-weight: 700; text-align: left; padding: 10px; border: 1px solid var(--bd); font-size: 0.85rem; white-space: nowrap; }
        td { padding: 8px 10px; border: 1px solid var(--bd); vertical-align: middle; color: #4b5563; white-space: nowrap; }
        .grp-cell { background: var(--blue-light); color: var(--blue-dark); font-weight: 600; vertical-align: top; }
        .subtotal-row td { background: var(--blue-light); color: var(--blue-dark); font-weight: 700; }
        .num { text-align: right; font-weight: 600; }
        .loading { text-align: center; padding: 20px; font-weight: bold; color: var(--p); font-size: 1rem; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<div class="card">
    <div class="header-top">
        <h1>📊 Pivot: Top 10 Style Dashboard</h1>
        <div class="btn-group">
            <button class="action-btn btn-excel" onclick="exportExcel()">⬇ Excel</button>
            <button class="action-btn btn-pdf" onclick="exportPDF()">⬇ PDF</button>
            <a href="upload.html" class="action-btn btn-upload">＋ Upload Data</a>
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <input type="text" id="dateRange" placeholder="Select Date Range...">
        <button class="btn-filter-toggle" onclick="toggleFilters()">Filters ▾</button>
        <button class="btn-apply-filters" onclick="fetchAndRender()">Apply Everything</button>
        <button class="btn-reset" onclick="resetFilters()">Reset</button>
    </div>

    <!-- Filter Panel -->
    <div class="filter-panel" id="filterPanel"></div>

    <div class="pivot-title">Grouping Columns (Tick / Untick Karein):</div>
    <div class="pivot-options" id="pivot-checkboxes"></div>
</div>

<div class="card">
    <div class="table-wrap">
        <table id="dataTable">
            <thead id="table-head"></thead>
            <tbody id="table-body">
                <tr><td class="loading" id="load-msg">Data load ho raha hai... Please wait.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://opxkaiksxjuumhgvqtvc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7Go66siqXlHsuEprgi-OUQ_LrolVyUi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ALL_COLS = [
        { id: 'location_alias', label: 'Location Alias' },
        { id: 'section_name', label: 'Section Name' },
        { id: 'department', label: 'Department' },
        { id: 'sub_section_name', label: 'Sub Section Name' },
        { id: 'sub_section_2', label: 'Sub Section 2' },
        { id: 'major_category', label: 'Major Category' },
        { id: 'article_name', label: 'Article Name' },
        { id: 'price_range', label: 'Price Range' },
        { id: 'sub_price_range', label: 'Sub Price Range' },
        { id: 'sub_major_category', label: 'Sub Major Category' },
        { id: 'brand_name', label: 'Brand Name' },
        { id: 'style_name', label: 'Style Name' },
        { id: 'fabric', label: 'Fabric' },
        { id: 'size_name', label: 'Size Name' }
    ];

    let rawData = [];
    let fpInstance;

    function toggleFilters() {
        const panel = document.getElementById('filterPanel');
        panel.style.display = (panel.style.display === 'grid') ? 'none' : 'grid';
    }

    // Date ko YYYY-MM-DD me convert karne ka safe helper
    function formatDateToYYYYMMDD(d) {
        if (!d) return null;
        let year = d.getFullYear();
        let month = String(d.getMonth() + 1).padStart(2, '0');
        let day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        fpInstance = flatpickr("#dateRange", { mode: "range", dateFormat: "Y-m-d" });

        // Build Checkboxes
        const chkContainer = document.getElementById('pivot-checkboxes');
        const defaults = ['major_category']; 
        
        ALL_COLS.forEach(col => {
            if(col.id !== 'style_name') { 
                const isChecked = defaults.includes(col.id) ? 'checked' : '';
                chkContainer.innerHTML += `
                    <label><input type="checkbox" class="pivot-chk" value="${col.id}" data-label="${col.label}" ${isChecked} onchange="processAndRenderTable()"> ${col.label}</label>
                `;
            }
        });

        // Build Filters
        const filterPanel = document.getElementById('filterPanel');
        ALL_COLS.forEach(col => {
            filterPanel.innerHTML += `
                <div class="filter-group">
                    <label>${col.label} (Ctrl+Click)</label>
                    <select id="flt_${col.id}" multiple class="filter-select" onchange="processAndRenderTable()"></select>
                </div>
            `;
        });

        await fetchAndRender();
    });

    // Fast RPC Function Data Fetch
    async function fetchAndRender() {
        const msg = document.getElementById('load-msg');
        msg.innerText = "Data load ho raha hai...";

        let startD = null, endD = null;
        const dates = fpInstance.selectedDates;
        
        // Strict Date Formatting Fix
        if (dates.length >= 1) {
            startD = formatDateToYYYYMMDD(dates[0]);
            endD = dates.length === 2 ? formatDateToYYYYMMDD(dates[1]) : startD;
        }

        try {
            // Direct RPC Call with properly formatted YYYY-MM-DD dates
            const { data, error } = await supabaseClient.rpc('get_pivot_summary', {
                p_start_date: startD,
                p_end_date: endD
            });

            if (error) throw error;

            rawData = data || [];
            populateFilterOptions();
            processAndRenderTable();
        } catch (err) {
            console.error(err);
            document.getElementById('table-body').innerHTML = `<tr><td class="loading" style="color:red;">Error: ${err.message}</td></tr>`;
        }
    }

    function populateFilterOptions() {
        ALL_COLS.forEach(col => {
            const selectElem = document.getElementById(`flt_${col.id}`);
            const currentSelected = Array.from(selectElem.selectedOptions).map(o => o.value);
            
            let uniqueVals = [...new Set(rawData.map(r => r[col.id]).filter(v => v))].sort();
            
            let html = '';
            uniqueVals.forEach(val => {
                let isSel = currentSelected.includes(val) ? 'selected' : '';
                html += `<option value="${val}" ${isSel}>${val}</option>`;
            });
            selectElem.innerHTML = html;
        });
    }

    function resetFilters() {
        fpInstance.clear();
        ALL_COLS.forEach(col => {
            document.getElementById(`flt_${col.id}`).selectedIndex = -1;
        });
        fetchAndRender();
    }

    function processAndRenderTable() {
        const tbody = document.getElementById('table-body');
        const thead = document.getElementById('table-head');

        if (!rawData || rawData.length === 0) {
            tbody.innerHTML = '<tr><td class="loading">Koi data nahi mila. Date check karein ya Upload karein.</td></tr>';
            thead.innerHTML = '';
            return;
        }

        // 1. Filter rawData according to selected options
        let filteredData = rawData;
        ALL_COLS.forEach(col => {
            const selectElem = document.getElementById(`flt_${col.id}`);
            const selectedVals = Array.from(selectElem.selectedOptions).map(o => o.value);
            if (selectedVals.length > 0) {
                filteredData = filteredData.filter(r => selectedVals.includes(r[col.id]));
            }
        });

        if (filteredData.length === 0) {
            tbody.innerHTML = '<tr><td class="loading">Is filter ke hisaab se koi data nahi mila.</td></tr>';
            thead.innerHTML = '';
            return;
        }

        // 2. Checked Pivot Boxes
        const checkedBoxes = Array.from(document.querySelectorAll('.pivot-chk:checked'));
        if (checkedBoxes.length === 0) {
            tbody.innerHTML = '<tr><td class="loading">Kam se kam ek Box Tick karein!</td></tr>';
            thead.innerHTML = '';
            return;
        }

        const groupCols = checkedBoxes.map(cb => cb.value);
        const groupLabels = checkedBoxes.map(cb => cb.getAttribute('data-label'));

        // 3. Aggregation
        let aggregated = {};
        filteredData.forEach(row => {
            let keyObj = {};
            groupCols.forEach(col => keyObj[col] = row[col] || '-');
            keyObj['style_name'] = row.style_name || '-';

            let keyStr = JSON.stringify(keyObj);
            if (!aggregated[keyStr]) {
                aggregated[keyStr] = { ...keyObj, sls: 0, cbs: 0 };
            }
            aggregated[keyStr].sls += Number(row.net_sls_qty) || 0;
            aggregated[keyStr].cbs += Number(row.cbs_qty) || 0;
        });

        // 4. Parent Grouping
        let parentGroups = {};
        Object.values(aggregated).forEach(row => {
            let parentKeyObj = {};
            groupCols.forEach(col => parentKeyObj[col] = row[col]);
            let parentKeyStr = JSON.stringify(parentKeyObj);

            if (!parentGroups[parentKeyStr]) {
                parentGroups[parentKeyStr] = { keys: parentKeyObj, styles: [], total_sls: 0, total_cbs: 0 };
            }
            parentGroups[parentKeyStr].styles.push(row);
            parentGroups[parentKeyStr].total_sls += row.sls;
            parentGroups[parentKeyStr].total_cbs += row.cbs;
        });

        let finalGroups = Object.values(parentGroups);

        // 5. Sort inner Top 10 by SLS
        finalGroups.forEach(pg => {
            pg.styles.sort((a, b) => b.sls - a.sls);
            pg.styles = pg.styles.slice(0, 10);
        });

        // 6. Sort parent groups by Highest Total SLS
        finalGroups.sort((a, b) => {
            let diff = b.total_sls - a.total_sls;
            if (diff !== 0) return diff;
            return JSON.stringify(a.keys).localeCompare(JSON.stringify(b.keys));
        });

        // 7. Render Header
        let headHtml = '<tr>';
        groupLabels.forEach(lbl => headHtml += `<th>${lbl}</th>`);
        headHtml += `<th>Style Name</th><th class="num">Net SLS Qty</th><th class="num">CBS Qty</th></tr>`;
        thead.innerHTML = headHtml;

        // 8. Render Rows
        let bodyHtml = '';
        finalGroups.forEach(pg => {
            let rowCount = pg.styles.length;
            if (rowCount === 0) return;

            pg.styles.forEach((styleRow, index) => {
                bodyHtml += `<tr>`;
                if (index === 0) {
                    groupCols.forEach(col => {
                        bodyHtml += `<td rowspan="${rowCount}" class="grp-cell">${pg.keys[col]}</td>`;
                    });
                }
                bodyHtml += `<td>${styleRow.style_name}</td>`;
                bodyHtml += `<td class="num">${styleRow.sls}</td>`;
                bodyHtml += `<td class="num">${styleRow.cbs}</td>`;
                bodyHtml += `</tr>`;
            });

            let colspan = groupCols.length;
            bodyHtml += `<tr class="subtotal-row">
                <td colspan="${colspan}">SUBTOTAL</td>
                <td></td>
                <td class="num">${pg.total_sls}</td>
                <td class="num">${pg.total_cbs}</td>
            </tr>`;
        });

        tbody.innerHTML = bodyHtml;
    }

    function exportExcel() {
        let table = document.getElementById("dataTable");
        let wb = XLSX.utils.table_to_book(table, {sheet: "Top 10 Styles"});
        XLSX.writeFile(wb, "Top_Style_Dashboard.xlsx");
    }

    function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'pt', 'a4');
        doc.text("Top 10 Style Pivot Report", 40, 30);
        doc.autoTable({
            html: '#dataTable', startY: 40, theme: 'grid', styles: { fontSize: 8 },
            headStyles: { fillColor: [55, 48, 163] }, alternateRowStyles: { fillColor: [238, 242, 255] }
        });
        doc.save('Top_Style_Dashboard.pdf');
    }
</script>

</body>
</html>
