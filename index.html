<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Top Style Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #4f46e5; --bg: #f3f4f6; --tx: #1f2937; --bd: #d1d5db; --blue-light: #eef2ff; --blue-dark: #3730a3; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--tx); padding: 20px; font-size: 13px; }
        
        .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 100%; margin: 0 auto; }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header-top h1 { font-size: 1.2rem; margin: 0; display: flex; align-items: center; gap: 8px; }
        .upload-btn { background: var(--p); color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; }
        
        .table-wrap { overflow-x: auto; border: 1px solid var(--bd); border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        
        /* Table Header Styling */
        th { background: var(--blue-light); color: var(--blue-dark); font-weight: 700; text-align: left; padding: 10px; border: 1px solid var(--bd); font-size: 0.85rem; }
        td { padding: 8px 10px; border: 1px solid var(--bd); vertical-align: middle; color: #4b5563; }
        
        /* Merged Cells Styling (Left side categories) */
        .grp-cell { background: var(--blue-light); color: var(--blue-dark); font-weight: 600; vertical-align: top; }
        
        /* Subtotal Row Styling */
        .subtotal-row td { background: var(--blue-light); color: var(--blue-dark); font-weight: 700; }
        .subtotal-label { text-align: left; }
        
        .num { text-align: right; font-weight: 600; }
        .loading { text-align: center; padding: 30px; font-weight: bold; color: var(--p); font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-top">
        <h1>🏆 Top 10 Style — Article ke hisaab se</h1>
        <a href="upload.html" class="upload-btn">＋ Upload Data</a>
    </div>
    
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Major Category</th>
                    <th>Sub Section Name</th>
                    <th>Article Name</th>
                    <th>Brand Name</th>
                    <th>Style Name</th>
                    <th class="num">Net SLS Qty</th>
                    <th class="num">CBS Qty</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="7" class="loading">Data load ho raha hai... Please wait.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://opxkaiksxjuumhgvqtvc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7Go66siqXlHsuEprgi-OUQ_LrolVyUi';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadData() {
        const tbody = document.getElementById('table-body');
        try {
            // Data fetch kar rahe hain
            const { data, error } = await supabaseClient
                .from('top_10_styles')
                .select('*');

            if (error) throw error;
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="loading">Koi data nahi mila. Upar "Upload Data" par click karein.</td></tr>';
                return;
            }

            // Data ko Group karne ka logic (Taki Merge aur Subtotal ban sake)
            let groups = [];
            let currentKey = null;
            let currentGroup = null;

            // Ensure data is sorted properly before grouping
            data.sort((a, b) => {
                let diff = (a.article_name || '').localeCompare(b.article_name || '');
                if (diff !== 0) return diff;
                return (b.sls || 0) - (a.sls || 0);
            });

            data.forEach(row => {
                let key = `${row.major_category}|${row.sub_section_name}|${row.article_name}`;
                if (key !== currentKey) {
                    currentGroup = {
                        major_category: row.major_category,
                        sub_section_name: row.sub_section_name,
                        article_name: row.article_name,
                        rows: [],
                        subtotal_sls: 0,
                        subtotal_cbs: 0
                    };
                    groups.push(currentGroup);
                    currentKey = key;
                }
                currentGroup.rows.push(row);
                currentGroup.subtotal_sls += (row.sls || 0);
                currentGroup.subtotal_cbs += (row.cbs || 0);
            });

            // HTML Generate karna
            let html = '';
            groups.forEach(g => {
                let rowCount = g.rows.length;
                
                g.rows.forEach((r, index) => {
                    html += `<tr>`;
                    // Pehli row me Major Category, Sub Section aur Article ko Merge (rowspan) kar do
                    if (index === 0) {
                        html += `<td rowspan="${rowCount}" class="grp-cell">${g.major_category || '-'}</td>`;
                        html += `<td rowspan="${rowCount}" class="grp-cell">${g.sub_section_name || '-'}</td>`;
                        html += `<td rowspan="${rowCount}" class="grp-cell">${g.article_name || '-'}</td>`;
                    }
                    // Baki columns normally print honge
                    html += `<td>${r.brand_name || '-'}</td>`;
                    html += `<td>${r.style_name || '-'}</td>`;
                    html += `<td class="num">${r.sls || 0}</td>`;
                    html += `<td class="num">${r.cbs || 0}</td>`;
                    html += `</tr>`;
                });

                // Har group ke baad Subtotal row add karna
                html += `<tr class="subtotal-row">
                    <td colspan="5" class="subtotal-label">SUBTOTAL</td>
                    <td class="num">${g.subtotal_sls}</td>
                    <td class="num">${g.subtotal_cbs}</td>
                </tr>`;
            });

            tbody.innerHTML = html;

        } catch (err) {
            console.error('Error fetching data:', err);
            tbody.innerHTML = `<tr><td colspan="7" class="loading" style="color:red;">Error: ${err.message}</td></tr>`;
        }
    }

    window.addEventListener('DOMContentLoaded', loadData);
</script>

</body>
</html>
