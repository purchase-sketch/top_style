<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; padding: 20px; }
        .card { background: #fff; max-width: 800px; margin: 0 auto; padding: 20px; border-radius: 12px; }
        textarea { width: 100%; height: 200px; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; }
        button { background: #4f46e5; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:disabled { background: #a5b4fc; cursor: wait; }
        .msg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>📥 Paste Excel Data Here</h2>
    <p>Excel se apna data copy karo aur yahan paste kar do (Columns same order me hone chahiye).</p>
    
    <textarea id="tsvData" placeholder="Excel se copy kiya hua data yahan paste karo..."></textarea>
    <button id="uploadBtn" onclick="uploadData()">Upload to Supabase</button>
    <div id="status" class="msg"></div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // DHYAAN DEIN: Publishable key me '...' ki jagah Supabase se copy karke puri key daalein
    const SUPABASE_URL = 'https://opxkaiksxjuumhgvqtvc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7Go66siqXlHsuEprgi-OUQ_LrolVyUi'; // <-
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function uploadData() {
        const btn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const rawData = document.getElementById('tsvData').value.trim();

        if (!rawData) {
            status.textContent = "Pehle data paste karo!";
            status.style.color = "red";
            return;
        }

        btn.disabled = true;
        status.textContent = "Upload ho raha hai... Please wait.";
        status.style.color = "blue";

        const rows = rawData.split('\n');
        const insertData = [];

        for (let i = 1; i < rows.length; i++) {
            const cols = rows[i].split('\t').map(c => c.trim());
            if (cols.length < 14) continue; 

            insertData.push({
                sub_section_name: cols[0],
                sub_section_2: cols[1],
                major_category: cols[2],
                article_name: cols[3],
                price_range: cols[4],
                sub_price_range: cols[5],
                sub_major_category: cols[6],
                brand_name: cols[7],
                style_name: cols[8],
                fabric: cols[9],
                size_name: cols[10],
                color_name: cols[11],
                net_sls_qty: parseFloat(cols[12]) || 0,
                cbs_qty: parseFloat(cols[13]) || 0
            });
        }

        if (insertData.length === 0) {
            status.textContent = "Koi valid data nahi mila!";
            status.style.color = "red";
            btn.disabled = false;
            return;
        }

        try {
            const { error } = await supabase.from('sales_stock').insert(insertData);
            if (error) throw error;
            
            status.textContent = `✅ Success! ${insertData.length} records upload ho gaye.`;
            status.style.color = "green";
            document.getElementById('tsvData').value = ''; 
        } catch (err) {
            console.error(err);
            status.textContent = "❌ Error: " + err.message;
            status.style.color = "red";
        }
        
        btn.disabled = false;
    }
</script>

</body>
</html>
