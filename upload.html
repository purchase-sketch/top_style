<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; padding: 20px; }
        .card { background: #fff; max-width: 900px; margin: 0 auto; padding: 20px; border-radius: 12px; }
        textarea { width: 100%; height: 250px; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; font-family: monospace; }
        button { background: #4f46e5; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:disabled { background: #a5b4fc; cursor: wait; }
        .msg { margin-top: 15px; font-weight: bold; }
        .back-btn { display: inline-block; margin-bottom: 15px; color: #4f46e5; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="card">
    <a href="index.html" class="back-btn">← Back to Dashboard</a>
    <h2>📥 Paste Excel Data Here</h2>
    <p>Excel se apna data copy karo aur yahan paste kar do (Total 18 columns same order me hone chahiye, jisme 'report date' sabse last me ho).</p>
    
    <textarea id="tsvData" placeholder="Location Alias | Section Name | Department | Sub Section Name | Sub Section 2 | Major Category | Article Name | Price Range | Sub Price Range | Sub Major Category | Brand Name | Style Name | Fabric | Size Name | Color Name | Net SLS Qty | CBS Qty | report date"></textarea>
    
    <button id="uploadBtn" onclick="uploadData()">Upload to Supabase</button>
    <div id="status" class="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://opxkaiksxjuumhgvqtvc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7Go66siqXlHsuEprgi-OUQ_LrolVyUi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Date Format Converter (DD-MM-YY / DD-MM-YYYY / DD/MM/YYYY to YYYY-MM-DD)
    function parseDateToISO(dateStr) {
        if (!dateStr) return null;
        dateStr = dateStr.trim();
        
        // Agar pehle se YYYY-MM-DD hai
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;

        // Splitting by '-', '/', or '.'
        let parts = dateStr.split(/[-/.]/);
        if (parts.length === 3) {
            let day = parts[0].padStart(2, '0');
            let month = parts[1].padStart(2, '0');
            let year = parts[2];

            // 2-digit year (jaise 26) ko 2026 banana
            if (year.length === 2) {
                year = '20' + year;
            }

            // Return in YYYY-MM-DD format
            if (year.length === 4) {
                return `${year}-${month}-${day}`;
            }
        }
        return dateStr; // fallback
    }

    async function uploadData() {
        const btn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const rawData = document.getElementById('tsvData').value.trim();

        if (!rawData) {
            status.textContent = "Pehle data paste karo!";
            status.style.color = "red";
            return;
        }

        btn.disabled = true;
        status.textContent = "Upload ho raha hai... Please wait.";
        status.style.color = "blue";

        const rows = rawData.split('\n');
        const insertData = [];
        
        let startIndex = rows[0].toLowerCase().includes('location alias') ? 1 : 0;

        for (let i = startIndex; i < rows.length; i++) {
            const cols = rows[i].split('\t').map(c => c.trim());
            
            if (cols.length < 18) continue; 

            // Date Convert Kar Rahe Hain
            let parsedDate = parseDateToISO(cols[17]);

            insertData.push({
                location_alias: cols[0],
                section_name: cols[1],
                department: cols[2],
                sub_section_name: cols[3],
                sub_section_2: cols[4],
                major_category: cols[5],
                article_name: cols[6],
                price_range: cols[7],
                sub_price_range: cols[8],
                sub_major_category: cols[9],
                brand_name: cols[10],
                style_name: cols[11],
                fabric: cols[12],
                size_name: cols[13],
                color_name: cols[14],
                net_sls_qty: parseFloat(cols[15]) || 0,
                cbs_qty: parseFloat(cols[16]) || 0,
                report_date: parsedDate
            });
        }

        if (insertData.length === 0) {
            status.textContent = "Koi valid data nahi mila! 18 columns check karo.";
            status.style.color = "red";
            btn.disabled = false;
            return;
        }

        try {
            const batchSize = 1000;
            for (let i = 0; i < insertData.length; i += batchSize) {
                const batch = insertData.slice(i, i + batchSize);
                const { error } = await supabaseClient.from('sales_stock').insert(batch);
                if (error) throw error;
            }
            
            status.textContent = `✅ Success! ${insertData.length} records upload ho gaye.`;
            status.style.color = "green";
            document.getElementById('tsvData').value = ''; 
        } catch (err) {
            console.error(err);
            status.textContent = "❌ Error: " + err.message;
            status.style.color = "red";
        }
        
        btn.disabled = false;
    }
</script>

</body>
</html>
